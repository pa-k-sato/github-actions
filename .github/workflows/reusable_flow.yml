name: Reusable flow

on:
  workflow_call:
    inputs:
      a-name:
        type: string

jobs:
  reusable_workflow_job:
    runs-on: ubuntu-latest
    steps:
      - name: sleep 2m
        run: 
          sleep 120
      - name: echo passed name
        run: 
          echo "passed is ${{ inputs.a-name }}"
